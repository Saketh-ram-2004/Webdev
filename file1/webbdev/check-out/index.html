<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cart</title>
    <link rel="stylesheet" href="style.css">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;700&display=swap" rel="stylesheet">
</head>
<body>
    <section>
        <h1>Your shopping cart</h1>
        <p>ID 123456</p>
        <div class="head">
        <img src="/MEdia/youriichi.jpeg" alt="Shopping Cart Image">
            <div class="title">
                <span id="name">Ecovacs Deebot OZMO N8 + robot vacuum cleaner W125978483</span>
                <span id="in">In stock</span>
            </div>
             
        </div>
        <div class="quantity">
                <span class="count blue">-</span>
                <span class="count">1</span>
                <span class="count blue">+</span>
            </div>
        <hr/>
        <div class="bill">
            <div class="b"><span>Standard package</span><span>FREE</span></div>
            <div class="b"><span>Total VAT</span><span>897,-</span></div>
            <div class="b" style="font-weight: bold;"><span>TOTAL NOK</span><span>4395,-</span></div>
        </div>
        <a href="#">Got a gift card or Promotional code?</a>
        <div class="checkout">
            <p id="check">Checkout</p>
        </div>
    </section>
</body>
</html>
